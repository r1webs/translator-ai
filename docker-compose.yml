services:

  ollama:
    image: ollama/ollama:latest
    container_name: ollama
    volumes:
      - ollama_models:/root/.ollama
    ports:
      - "11434:11434"
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s
    restart: unless-stopped

  ollama-init:
    image: ollama/ollama:latest
    container_name: ollama-init
    depends_on:
      ollama:
        condition: service_healthy
    volumes:
      - ollama_models:/root/.ollama
    environment:
      OLLAMA_HOST: http://ollama:11434
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        echo "Pulling model ${OLLAMA_MODEL:-llama3:8b}..."
        ollama pull ${OLLAMA_MODEL:-llama3:8b}
        echo "Model ready."
    restart: "no"

  translator-api:
    build:
      context: .
      dockerfile: translator-services/Dockerfile
    container_name: translator-api
    depends_on:
      ollama:
        condition: service_healthy
      ollama-init:
        condition: service_completed_successfully
    environment:
      NODE_ENV: production
      PORT: 8080
      OLLAMA_BASE_URL: http://ollama:11434
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3:8b}
    ports:
      - "8080:8080"
    restart: unless-stopped

  translator-web:
    build:
      context: .
      dockerfile: translator-web-app/Dockerfile
    container_name: translator-web
    depends_on:
      - translator-api
    ports:
      - "3000:80"
    restart: unless-stopped

volumes:
  ollama_models:
    driver: local
